name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv installer\.venv-build
          .\installer\.venv-build\Scripts\python.exe -m pip install --disable-pip-version-check -r installer\requirements-build.txt

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements

      - name: Build installer
        shell: pwsh
        run: .\installer\build_installer.ps1 -SkipCrossCheck

      - name: Verify tag matches extension version
        shell: pwsh
        run: |
          $version = (Get-Content installer\generated\version.txt).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match extension version $version"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: installer/dist/CentralRecepcionista_Setup.exe
